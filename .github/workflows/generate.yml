name: Run Script and Update Zipconfig

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'zipconfig.json'

jobs:
  run-python:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Skript ausführen
        run: python generate_config.py

      - name: Änderungen committen und pushen
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "auto: zipconfig.json aktualisiert"
          file_pattern: "zipconfig.json"